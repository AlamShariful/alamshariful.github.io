<header class="site-header" id="site-header">
    <div class="header-container">
        <a href="{{ '/' | relative_url }}" class="logo" aria-label="Shariful Alam - Home">
            <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="Shariful Alam" class="logo-image">
            <span class="logo-text">Shariful<span class="logo-accent">Alam</span></span>
        </a>

        <nav class="main-nav" id="main-nav" aria-label="Main navigation">
            <ul class="nav-list">
                <li><a href="{{ '/' | relative_url }}#home" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a></li>
                <li><a href="{{ '/' | relative_url }}#about" class="nav-link">About</a></li>
                <li><a href="{{ '/' | relative_url }}#experience" class="nav-link">Experience</a></li>
                <li><a href="{{ '/' | relative_url }}#publications" class="nav-link">Publications</a></li>
                <li><a href="{{ '/blog/' | relative_url }}" class="nav-link {% if page.url contains '/blog' %}active{% endif %}">Blog</a></li>
                <li><a href="{{ '/' | relative_url }}#contact" class="nav-link">Contact</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme">
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </div>
</header>
